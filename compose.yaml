services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: lamma
      POSTGRES_USER: lamma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamma -d lamma"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      DATABASE_URL: postgresql+psycopg://lamma:${POSTGRES_PASSWORD}@db:5432/lamma
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8002}
      LAMMA_ENV: ${LAMMA_ENV:-development}
      MAIL_MODE: ${MAIL_MODE:-local}
      REQUIRE_VERIFICATION: "1"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
