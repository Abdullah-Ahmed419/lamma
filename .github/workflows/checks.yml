name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/app.js
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lamma
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lamma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lamma -d lamma_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q test_flow.py -k postgresql
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://lamma:ci-only-password@localhost:5432/lamma_test
